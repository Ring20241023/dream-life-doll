<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#F1F1F1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="制作小人">
<meta name="format-detection" content="telephone=no">
<title>梦想生活 · 制作小人</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='19' fill='%2300A8E8'/%3E%3Ccircle cx='13' cy='17' r='3' fill='%23fff'/%3E%3Ccircle cx='27' cy='17' r='3' fill='%23fff'/%3E%3Cpath d='M13 25q7 6 14 0' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#EDEDED;
    --panel:#FFFFFF;
    --line:#E1E1E1;
    --ink:#333333;
    --sub:#8C8C8C;
    --accent:#00A8E8;
    --accent-soft:#E6F6FD;
    --tile:#F5F5F5;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--bg);
    height:100vh;height:100dvh;
    overflow:hidden;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;
  }
  .app{
    position:relative;
    width:100%;max-width:480px;
    height:100%;height:var(--app-h,100dvh);
    margin:0 auto;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
    background:var(--bg);
  }

  /* ---------- 顶栏 ---------- */
  .bar{
    flex:0 0 auto;
    height:52px;
    display:flex;align-items:center;gap:7px;
    padding:0 12px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .bar .title{
    flex:1 1 auto;text-align:center;
    font-size:15px;font-weight:700;letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bar .title small{display:block;font-size:9px;font-weight:500;color:var(--sub);letter-spacing:1px;margin-top:1px;}
  .btn{
    flex:0 0 auto;
    border:none;font-family:inherit;font-size:12px;font-weight:600;
    padding:8px 11px;border-radius:8px;
    background:#F1F1F1;color:#5A5A5A;
    cursor:pointer;
    transition:transform .12s ease,background .18s ease;
  }
  .btn:active{transform:scale(.94);}
  .btn.solid{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(0,168,232,.3);}

  /* ---------- 预览 ---------- */
  .stage{
    position:relative;
    flex:1 1 auto;min-height:0;
    margin:10px 10px 0;
    border-radius:16px;
    background:radial-gradient(75% 65% at 50% 38%,#FFFFFF 0%,#F4F4F4 60%,#ECECEC 100%);
    box-shadow:0 1px 3px rgba(0,0,0,.08), inset 0 0 0 1px rgba(0,0,0,.03);
    display:flex;flex-direction:column;
    overflow:hidden;
    transition:background .3s ease;
  }
  .char-wrap{
    position:relative;
    flex:1 1 auto;min-height:0;
    padding-top:6px;
  }
  #avatar{
    position:absolute;left:0;top:0;right:0;bottom:0;
    width:100%;height:100%;display:block;
    animation:bob 4.6s ease-in-out infinite;
    transform-origin:50% 92%;
  }
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  .char-wrap.pop #avatar{animation:pop .4s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(.95,.92);}
    70%{transform:scale(1.03,1.02);}
    100%{transform:scale(1);}
  }
  .eye-blink{animation:blink 5.6s infinite;transform-box:fill-box;transform-origin:center;}
  @keyframes blink{
    0%,91%,100%{transform:scaleY(1);}
    94%{transform:scaleY(.08);}
    96%{transform:scaleY(1);}
  }
  .namebar{
    flex:0 0 auto;
    display:flex;justify-content:center;
    padding:0 0 10px;
  }
  .name-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.9);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 10px 4px 12px;
  }
  .name-chip span{font-size:10px;color:var(--sub);}
  #name{
    border:none;outline:none;background:transparent;
    font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);
    width:5em;text-align:center;padding:0;line-height:1.2;
    -webkit-user-select:text;user-select:text;
    -webkit-appearance:none;appearance:none;
  }

  /* ---------- 底部面板 ---------- */
  .dock{
    flex:0 0 auto;
    background:var(--panel);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    padding:8px 0 calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
  }
  .rail{
    display:flex;gap:2px;
    overflow-x:auto;
    padding:0 10px 6px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%);
    mask-image:linear-gradient(to right,#000 calc(100% - 16px),transparent 100%);
  }
  .rail::-webkit-scrollbar{display:none;}
  .cat{
    flex:0 0 auto;width:52px;
    border:none;background:transparent;padding:4px 0 3px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    border-radius:9px;
    color:var(--sub);cursor:pointer;
    transition:background .16s,color .16s;
  }
  .cat svg{width:21px;height:21px;display:block;}
  .cat span{font-size:9.5px;font-weight:600;letter-spacing:.2px;}
  .cat.on{color:var(--accent);background:var(--accent-soft);}

  .opt-head{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:2px 14px 6px;
    font-size:10.5px;color:var(--sub);
  }
  .opt-head b{font-size:12px;color:var(--ink);font-weight:700;margin-right:4px;}

  .grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
    padding:0 12px 6px;
  }
  .tile{
    aspect-ratio:1/1;
    border:2px solid transparent;
    background:var(--tile);
    border-radius:10px;
    padding:0;overflow:hidden;
    cursor:pointer;
    transition:border-color .16s,background .16s,box-shadow .16s,transform .12s;
  }
  .tile:active{transform:scale(.93);}
  .tile.on{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);}
  .tile svg{display:block;width:100%;height:100%;}
  .bgsw{display:block;width:100%;height:100%;}
  @supports not (aspect-ratio:1/1){
    .tile{height:52px;}
  }

  .sliders{padding:0 14px;}
  .sgroups{display:none;gap:6px;padding:0 14px 5px;overflow-x:auto;scrollbar-width:none;}
  .sgroups::-webkit-scrollbar{display:none;}
  .sgrp{
    flex:0 0 auto;border:none;font-family:inherit;
    font-size:10.5px;font-weight:700;color:var(--sub);
    background:#F1F1F1;padding:4px 9px;border-radius:999px;cursor:pointer;
    transition:background .16s,color .16s;
  }
  .sgrp.on{background:var(--accent);color:#fff;}
  .srow{display:flex;align-items:center;gap:9px;height:30px;}
  .srow .slabel{flex:0 0 30px;font-size:10.5px;color:var(--sub);}
  .srow .sval{flex:0 0 32px;text-align:right;font-size:10.5px;color:var(--accent);font-weight:700;}
  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1 1 auto;height:24px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#E3E3E3;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent);border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.28);margin-top:-7px;
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#E3E3E3;}
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;background:var(--accent);
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);
  }

  .colors{display:flex;gap:9px;overflow-x:auto;padding:5px 14px 3px;scrollbar-width:none;}
  .colors::-webkit-scrollbar{display:none;}
  .sw{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;
    background:var(--c);border:2px solid #fff;padding:0;cursor:pointer;
    box-shadow:0 0 0 1px rgba(0,0,0,.14);
    transition:transform .14s,box-shadow .18s;
  }
  .sw:active{transform:scale(.9);}
  .sw.on{transform:scale(1.1);box-shadow:0 0 0 2px var(--accent),0 2px 6px rgba(0,168,232,.3);}

  .toast{
    position:fixed;left:50%;bottom:calc(200px + env(safe-area-inset-bottom));
    transform:translate(-50%,12px);
    background:rgba(50,50,50,.94);color:#fff;
    font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:10px;
    opacity:0;pointer-events:none;z-index:50;
    max-width:86%;line-height:1.4;text-align:center;
    transition:opacity .2s,transform .2s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0);}

  .sheet{
    position:fixed;left:0;right:0;top:0;bottom:0;
    background:rgba(0,0,0,.55);
    display:flex;align-items:center;justify-content:center;
    padding:24px;z-index:60;
    opacity:0;pointer-events:none;
    transition:opacity .2s ease;
  }
  .sheet.on{opacity:1;pointer-events:auto;}
  .sheet-card{
    width:100%;max-width:330px;
    background:#fff;border-radius:16px;
    padding:14px;display:flex;flex-direction:column;
    align-items:center;gap:10px;
    transform:scale(.96);transition:transform .2s ease;
  }
  .sheet.on .sheet-card{transform:scale(1);}
  .sheet-title{font-size:12px;color:#6B6B6B;font-weight:600;}
  #saveImg{width:100%;border-radius:10px;display:block;background:#F5F5F5;}
  .sheet .btn{width:100%;padding:10px;font-size:13px;}
  .psample{
    width:100%;border:none;background:#fff;padding:0;
    border-radius:12px;overflow:hidden;cursor:pointer;
    display:block;font-family:inherit;
    box-shadow:0 0 0 1px var(--line);
    transition:transform .12s;
  }
  .psample:active{transform:scale(.97);}
  .psample img{
    width:100%;height:170px;display:block;
    object-fit:cover;object-position:50% 18%;
  }
  .psample span{
    display:block;padding:8px;background:#fff;
    font-size:12.5px;font-weight:700;color:var(--accent);
  }

  @media (max-width:400px){
    .bar{padding:0 8px;gap:5px;}
    .bar .title{font-size:13.5px;}
    .bar .title small{font-size:8.5px;letter-spacing:.5px;}
    .btn{padding:7px 8px;font-size:11px;}
  }
  @media (max-height:700px){
    .bar{height:46px;}
    .stage{margin-top:6px;}
    .dock{padding-top:6px;}
    .cat{width:48px;}
    .cat svg{width:19px;height:19px;}
    .cat span{font-size:9px;}
    .grid{gap:5px;padding-bottom:4px;}
    .tile{border-radius:8px;}
    .srow{height:27px;}
  }
  @media (min-width:520px){
    body{display:flex;align-items:center;justify-content:center;}
    .app{height:min(920px,100dvh);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.16);}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="btn" id="btnPhoto">照片</button>
    <button class="btn" id="btnRandom">随机</button>
    <div class="title">制作小人<small>梦想生活</small></div>
    <button class="btn" id="btnSave">保存</button>
    <button class="btn solid" id="btnShare">分享</button>
    <input type="file" id="fileIn" accept="image/*" hidden>
  </div>

  <div class="stage">
    <div class="char-wrap" id="charWrap">
      <svg id="avatar" viewBox="38 22 324 384" preserveAspectRatio="xMidYMax meet"></svg>
    </div>
    <div class="namebar">
      <div class="name-chip">
        <span>名字</span>
        <input id="name" maxlength="8" value="小梦" autocomplete="off" spellcheck="false">
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="rail" id="rail"></div>
    <div class="opt-head"><span id="optName"></span><span id="optIdx"></span></div>
    <div class="grid" id="grid"></div>
    <div class="sgroups" id="sgroups"></div>
    <div class="sliders" id="sliders"></div>
    <div class="colors" id="colors"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="saveSheet">
  <div class="sheet-card">
    <div class="sheet-title">长按图片 → 存储到照片</div>
    <img id="saveImg" alt="我的小人">
    <button class="btn" id="sheetClose">关闭</button>
  </div>
</div>
<div class="sheet" id="photoSheet">
  <div class="sheet-card">
    <div class="sheet-title">选一张正脸照片，自动捏出小人</div>
    <button class="psample" id="btnSample">
      <img id="sampleImg" alt="示例照片">
      <span>使用示例照片</span>
    </button>
    <button class="btn solid" id="btnPickFile">从手机选择照片</button>
    <button class="btn" id="photoClose">关闭</button>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(s){ return document.querySelector(s); };

  /* ================= 基础数据 ================= */
  var SKIN = ['#FFE7D6','#F8CFAC','#EAB588','#D19464','#AC6E42','#7F4B29'];
  var SKIN_NAME = ['白皙','浅肤','自然','小麦','深棕','黝黑'];
  var HAIR_COLOR = ['#2B211C','#4A3021','#7A4A28','#B07C3E','#E2C071','#C0453F','#DCDCDC','#6E5A8C'];
  var EYE_COLOR = ['#2B211C','#6B4423','#3E6FA8','#3E8B62'];
  var MOUTH_COLOR = ['#B4555E','#E27C86','#C97A4E','#8E5A4A'];
  var OUTFIT_COLOR = ['#F26D7D','#F2A65A','#F2D25A','#7FD1A0','#6EC3E0','#8F9BE8','#B98FE0','#F0F0F5','#5C5470','#D9584F'];
  var SIZE_V = [0.84,1,1.16];
  var SIZE_N = ['小','中','大'];

  var BGS = [
    {n:'奶油', a:'#FFF9EF', b:'#FFDFCB', deco:'#FFC4AD'},
    {n:'薄荷', a:'#F0FCF6', b:'#C4EEDB', deco:'#96DABC'},
    {n:'蜜桃', a:'#FFF0F3', b:'#FFC2D2', deco:'#FF9DB6'},
    {n:'星夜', a:'#3B3F66', b:'#5A4E80', deco:'#FFF0C4'}
  ];

  function shade(hex, amt){
    var n = parseInt(hex.slice(1),16);
    var r = Math.max(0,Math.min(255,(n>>16)+amt));
    var g = Math.max(0,Math.min(255,((n>>8)&255)+amt));
    var b = Math.max(0,Math.min(255,(n&255)+amt));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  function starPts(cx,cy,r1,r2,n){
    n = n || 5;
    var p = '';
    for(var i=0;i<n*2;i++){
      var r = (i%2) ? r2 : r1;
      var a = -Math.PI/2 + i*Math.PI/n;
      p += (i?'L':'M') + (cx + r*Math.cos(a)).toFixed(1) + ' ' + (cy + r*Math.sin(a)).toFixed(1);
    }
    return p + 'Z';
  }

  /* ================= 脸型（8） ================= */
  var FACE = [
    {n:'圆脸', d:'M200 80 C264 80 312 132 312 200 C312 268 264 320 200 320 C136 320 88 268 88 200 C88 132 136 80 200 80Z'},
    {n:'鹅蛋', d:'M200 70 C254 70 302 128 302 204 C302 274 258 330 200 330 C142 330 98 274 98 204 C98 128 146 70 200 70Z'},
    {n:'方脸', d:'M200 82 C256 82 308 104 310 166 L310 228 C310 286 264 318 200 318 C136 318 90 286 90 228 L90 166 C92 104 144 82 200 82Z'},
    {n:'瓜子', d:'M200 74 C258 74 300 120 302 186 C305 256 258 324 200 338 C142 324 95 256 98 186 C100 120 142 74 200 74Z'},
    {n:'宽脸', d:'M200 86 C272 86 318 134 318 202 C318 268 274 316 200 316 C126 316 82 268 82 202 C82 134 128 86 200 86Z'},
    {n:'长脸', d:'M200 66 C250 66 296 122 296 208 C296 280 256 334 200 334 C144 334 104 280 104 208 C104 122 150 66 200 66Z'},
    {n:'尖下巴', d:'M200 76 C264 76 306 124 308 192 C310 262 258 318 200 342 C142 318 90 262 92 192 C94 124 136 76 200 76Z'},
    {n:'小圆脸', d:'M200 88 C258 88 304 138 304 204 C304 268 260 314 200 314 C140 314 96 268 96 204 C96 138 142 88 200 88Z'}
  ];

  /* ================= 发型（12） ================= */
  var CAP = 'M78 206 A122 140 0 0 1 322 206';
  var HAIR = [
    {n:'短碎发',
      front:function(c){ return '<path d="'+CAP+' C322 194 304 166 262 152 L246 176 L228 148 L208 180 L190 150 L170 176 L152 150 L138 172 C100 168 80 190 78 206 Z" fill="'+c+'"/>'; }},
    {n:'齐刘海',
      front:function(c){ return '<path d="'+CAP+' C322 190 306 158 200 158 C94 158 78 190 78 206 Z" fill="'+c+'"/>'; }},
    {n:'中分',
      front:function(c){ return '<path d="'+CAP+' C318 198 306 176 262 164 C238 158 214 150 200 146 C186 150 162 158 138 164 C94 176 82 198 78 206 Z" fill="'+c+'"/>'; }},
    {n:'蓬松卷',
      back:function(c){ return '<ellipse cx="200" cy="236" rx="142" ry="150" fill="'+c+'"/><circle cx="86" cy="358" r="28" fill="'+c+'"/><circle cx="314" cy="358" r="28" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 200 296 166 244 158 C226 156 210 154 200 154 C190 154 174 156 156 158 C104 166 78 200 78 206 Z" fill="'+c+'"/><circle cx="148" cy="146" r="16" fill="'+c+'"/><circle cx="200" cy="140" r="17" fill="'+c+'"/><circle cx="252" cy="146" r="16" fill="'+c+'"/>'; }},
    {n:'双马尾',
      back:function(c){ return '<ellipse cx="74" cy="286" rx="36" ry="62" fill="'+c+'" transform="rotate(-14 74 286)"/><ellipse cx="326" cy="286" rx="36" ry="62" fill="'+c+'" transform="rotate(14 326 286)"/><ellipse cx="200" cy="204" rx="126" ry="140" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 192 300 160 200 160 C100 160 78 192 78 206 Z" fill="'+c+'"/><circle cx="96" cy="196" r="13" fill="'+shade(c,-30)+'"/><circle cx="304" cy="196" r="13" fill="'+shade(c,-30)+'"/>'; }},
    {n:'长直发',
      back:function(c){ return '<rect x="62" y="118" width="276" height="336" rx="88" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 196 296 162 236 154 C214 152 196 140 200 128 C150 142 96 166 78 206 Z" fill="'+c+'"/>'; }},
    {n:'丸子头',
      back:function(c){ return '<circle cx="200" cy="54" r="42" fill="'+c+'"/><ellipse cx="200" cy="200" rx="122" ry="132" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 194 304 162 200 162 C96 162 78 194 78 206 Z" fill="'+c+'"/><circle cx="200" cy="60" r="30" fill="'+shade(c,14)+'" opacity=".35"/>'; }},
    {n:'小呆毛',

    {n:'侧分',
      front:function(c){ return '<path d="'+CAP+' C322 196 300 160 232 150 C210 147 194 138 182 126 C148 146 96 166 78 206 Z" fill="'+c+'"/>'; }},
    {n:'双丸子',
      back:function(c){ return '<circle cx="146" cy="74" r="32" fill="'+c+'"/><circle cx="254" cy="74" r="32" fill="'+c+'"/><ellipse cx="200" cy="204" rx="120" ry="128" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 192 300 160 200 160 C100 160 78 192 78 206 Z" fill="'+c+'"/>'; }},
    {n:'爆炸头',
      back:function(c){ return '<circle cx="200" cy="200" r="140" fill="'+c+'"/><circle cx="96" cy="126" r="40" fill="'+c+'"/><circle cx="304" cy="126" r="40" fill="'+c+'"/><circle cx="200" cy="88" r="44" fill="'+c+'"/>'; },
      front:function(c){ return '<path d="'+CAP+' C322 198 302 162 200 156 C98 162 78 198 78 206 Z" fill="'+c+'"/><circle cx="126" cy="132" r="26" fill="'+c+'"/><circle cx="274" cy="132" r="26" fill="'+c+'"/>'; }},
    {n:'光头', front:function(){ return ''; }}
  ];

  /* ================= 眼睛（12） ================= */

  function eyeDecor(s){

    return '<g transform="translate(200,'+y+') scale('+sc+','+sc+')">'+g+'</g>';
  }
  function mouthSVG(s){
    var sc = SIZE_V[s.mouthSize], y = 272 + s.mouthY*4;
    var g = MOUTH[s.mouth].d(MOUTH_COLOR[s.mouthColor]);
    return '<g transform="translate(200,'+y+') scale('+sc+','+sc+')">'+g+'</g>';
  }

  /* 高矮胖瘦：以肩线/腰线为轴缩放躯干 */
  function bodyTf(s){
    var sy = 1 - (s.bodyH || 0) * 0.035;   // 更高 → 肩线下移，显脖子长
    var sx = 1 + (s.bodyW || 0) * 0.07;    // 更胖 → 肩宽
    return 'translate(200,520) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ') translate(-200,-520)';
  }

  function characterSVG(s){
    var sk = SKIN[s.skin], hc = HAIR_COLOR[s.hairColor];
    var hair = HAIR[s.hair];
    var out = '';
    if(hair.back) out += hair.back(hc);
    out += '<rect x="180" y="286" width="40" height="200" rx="18" fill="'+shade(sk,-16)+'"/>';
    out += '<g transform="'+bodyTf(s)+'">' + OUTFIT[s.outfit].d(OUTFIT_COLOR[s.outfitColor]) + '</g>';
    out += '<ellipse cx="92" cy="224" rx="17" ry="25" fill="'+shade(sk,-10)+'"/>';
    out += '<ellipse cx="308" cy="224" rx="17" ry="25" fill="'+shade(sk,-10)+'"/>';
    out += '<path d="'+FACE[s.face].d+'" fill="'+sk+'"/>';
    out += '<ellipse cx="140" cy="188" rx="34" ry="24" fill="#fff" opacity=".10"/>';
    out += WRINKLE[s.wrinkle].d(sk);
    out += browsSVG(s, hc);
    out += eyesSVG(s);
    out += noseSVG(s);
    out += mouthSVG(s);
    out += BEARD[s.beard].d(hc);
    if(hair.front) out += hair.front(hc);
    if(s.mole) out += '<circle cx="240" cy="256" r="3.6" fill="#6B4A33" opacity=".7"/>';
    out += GLASSES[s.glasses].d(212 + s.eyeY*4);
    return out;
  }

  function bgSVG(i){
    var b = BGS[i] || BGS[0];
    var deco;
    if(i === 3){
      var pts = [[58,92,3],[108,58,2],[300,66,3],[342,142,2],[76,196,2],[318,236,2.5],[150,120,2]];
      deco = '';
      for(var k=0;k<pts.length;k++){ deco += '<circle cx="'+pts[k][0]+'" cy="'+pts[k][1]+'" r="'+pts[k][2]+'" fill="'+b.deco+'" opacity=".85"/>'; }
      deco += '<circle cx="332" cy="72" r="24" fill="#FFF2C9" opacity=".92"/><circle cx="322" cy="66" r="24" fill="'+b.b+'"/>';
    } else {
      deco = '<circle cx="66" cy="104" r="62" fill="#fff" opacity=".42"/>'
           + '<circle cx="338" cy="176" r="44" fill="#fff" opacity=".34"/>'
           + '<circle cx="118" cy="330" r="22" fill="'+b.deco+'" opacity=".38"/>'
           + '<circle cx="300" cy="322" r="15" fill="'+b.deco+'" opacity=".34"/>'
           + '<ellipse cx="200" cy="524" rx="200" ry="58" fill="#fff" opacity=".45"/>';
    }
    return '<rect width="400" height="520" fill="url(#bgGrad)"/>' + deco;
  }

  /* ================= 分类配置 ================= */
  var LISTS = {face:FACE, skin:null, wrinkle:WRINKLE, hair:HAIR, eye:EYES, brow:BROW, nose:NOSE, mouth:MOUTH, beard:BEARD, glasses:GLASSES, mole:[{n:'无'},{n:'有'}], outfit:OUTFIT, bg:BGS};

  var CATS = [
    {id:'face',    label:'脸型', key:'face',    vb:'70 40 260 320'},
    {id:'skin',    label:'肤色', key:'skin',    vb:'70 40 260 320', colorKey:'skin', colorOnly:true},
    {id:'wrinkle', label:'皱纹', key:'wrinkle', vb:'104 150 192 170'},
    {id:'hair',    label:'发型', key:'hair',    vb:'50 20 300 340', colorKey:'hairColor'},
    {id:'eye',     label:'眼睛', key:'eye',     vb:'116 164 168 96', colorKey:'eyeColor',
      groups:[
        {n:'形状',   keys:['eyeSize','eyeY']},
        {n:'睫毛',   keys:['lashN','lashY','lashSize','lashThick']},
        {n:'双眼皮', keys:['lidY','lidSize','lidThick']},
        {n:'下眼睑', keys:['lowY','lowSize','lowThick']},
        {n:'高光',   keys:['hlShape','hlSize','hlX','hlY']}
      ]},
    {id:'brow',    label:'眉毛', key:'brow',    vb:'122 152 156 58', sliders:['browSize','browY']},
    {id:'nose',    label:'鼻子', key:'nose',    vb:'170 216 60 54', sliders:['noseSize','noseY']},
    {id:'mouth',   label:'嘴巴', key:'mouth',   vb:'170 250 60 48', colorKey:'mouthColor', sliders:['mouthSize','mouthY']},
    {id:'beard',   label:'胡子', key:'beard',   vb:'118 228 164 126'},
    {id:'glasses', label:'眼镜', key:'glasses', vb:'84 156 232 124'},
    {id:'mole',    label:'痣',   key:'mole',    vb:'104 150 192 180'},
    {id:'outfit',  label:'服装', key:'outfit',  vb:'84 300 232 220', colorKey:'outfitColor'},
    {id:'body',    label:'身体', sliderOnly:true, sliders:['bodyH','bodyW']},
    {id:'bg',      label:'背景', key:'bg'}
  ];

  var COLORS = {skin:SKIN, hairColor:HAIR_COLOR, eyeColor:EYE_COLOR, mouthColor:MOUTH_COLOR, outfitColor:OUTFIT_COLOR};
  var COLOR_NAMES = {skin:SKIN_NAME};
  var HEIGHT_N = ['最矮','很矮','偏矮','标准','偏高','很高','最高'];
  var BUILD_N = ['最瘦','很瘦','偏瘦','标准','偏胖','很胖','最胖'];
  var LASH_N = ['无','1 根','2 根','3 根','4 根','5 根'];
  var HL_N = ['圆','星','心','水滴'];
  var X_N = ['最左','很左','偏左','居中','偏右','很右','最右'];
  var Y_N = ['最上','很上','偏上','居中','偏下','很下','最下'];
  var SLIDERS = {
    eyeSize:{label:'大小', min:0, max:2}, eyeY:{label:'高度', min:-3, max:3},
    lashN:{label:'根数', min:0, max:5, opts:LASH_N},
    lashY:{label:'位置', min:-3, max:3, opts:Y_N},
    lashSize:{label:'大小', min:0, max:2},
    lashThick:{label:'粗细', min:0, max:2},
    lidY:{label:'位置', min:-3, max:3, opts:Y_N},
    lidSize:{label:'大小', min:0, max:2},
    lidThick:{label:'粗细', min:0, max:2},
    lowY:{label:'位置', min:-3, max:3, opts:Y_N},
    lowSize:{label:'大小', min:0, max:2},
    lowThick:{label:'粗细', min:0, max:2},
    hlShape:{label:'形状', min:0, max:3, opts:HL_N},
    hlSize:{label:'大小', min:0, max:2},
    hlX:{label:'左右', min:-3, max:3, opts:X_N},
    hlY:{label:'上下', min:-3, max:3, opts:Y_N},
    browSize:{label:'大小', min:0, max:2}, browY:{label:'高度', min:-3, max:3},
    noseSize:{label:'大小', min:0, max:2}, noseY:{label:'高度', min:-3, max:3},
    mouthSize:{label:'大小', min:0, max:2}, mouthY:{label:'高度', min:-3, max:3},
    bodyH:{label:'身高', min:-3, max:3, opts:HEIGHT_N},
    bodyW:{label:'体型', min:-3, max:3, opts:BUILD_N}
  };
  function sliderText(key, v){
    var cfg = SLIDERS[key];
    if(cfg.opts) return cfg.opts[v - cfg.min];
    if(cfg.max === 2) return SIZE_N[v];
    return v === 0 ? '居中' : (v > 0 ? '偏下' : '偏上');
  }
  var gIdx = {};
  function groupIdx(id){ return gIdx[id] || 0; }
  function groupKeys(cat){
    if(!cat.groups) return cat.sliders;
    return cat.groups[groupIdx(cat.id)].keys;
  }

  /* 分类图标 */
  function icon(id){
    var p = 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
    switch(id){
      case 'face': return '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="9" '+p+'/><circle cx="9.4" cy="11" r="1.1" fill="currentColor"/><circle cx="14.6" cy="11" r="1.1" fill="currentColor"/><path d="M9.6 15q2.4 2 4.8 0" '+p+'/></svg>';
      case 'skin': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" '+p+'/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor" opacity=".45" stroke="none"/></svg>';
      case 'wrinkle': return '<svg viewBox="0 0 24 24"><path d="M4 9q4-3 8 0t8 0" '+p+'/><path d="M4 15q4-3 8 0t8 0" '+p+'/></svg>';
      case 'hair': return '<svg viewBox="0 0 24 24"><path d="M4 14C4 7 8 4 12 4s8 3 8 10" '+p+'/><path d="M7 12c1-3 3-4 5-4s4 1 5 4" '+p+'/></svg>';
      case 'eye': return '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z" '+p+'/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg>';
      case 'brow': return '<svg viewBox="0 0 24 24"><path d="M4 15q8-7 16-3" '+p+'/><path d="M4 19q8-5 16-2" '+p+' opacity=".35"/></svg>';
      case 'nose': return '<svg viewBox="0 0 24 24"><path d="M13 4v10a4 4 0 0 0 4 4h2" '+p+'/><path d="M10 18h6" '+p+'/></svg>';
      case 'mouth': return '<svg viewBox="0 0 24 24"><path d="M4 10q8 9 16 0" '+p+'/><path d="M4 10h16" '+p+'/></svg>';
      case 'beard': return '<svg viewBox="0 0 24 24"><path d="M5 9q3-2 7 0t7 0" '+p+'/><path d="M7 13q5 6 10 0" '+p+'/></svg>';
      case 'glasses': return '<svg viewBox="0 0 24 24"><circle cx="7.5" cy="13" r="3.6" '+p+'/><circle cx="16.5" cy="13" r="3.6" '+p+'/><path d="M11.1 13h1.8M3.9 12 2 10.5M20.1 12 22 10.5" '+p+'/></svg>';
      case 'mole': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" '+p+'/><circle cx="14.5" cy="13.5" r="1.6" fill="currentColor" stroke="none"/></svg>';
      case 'outfit': return '<svg viewBox="0 0 24 24"><path d="M9 4 4 7l2 4 1.5-1v10h9V10L18 11l2-4-5-3-3 2z" '+p+'/></svg>';
      case 'body': return '<svg viewBox="0 0 24 24"><circle cx="12" cy="4.6" r="2.6" '+p+'/><path d="M12 8v7M7.5 10.5 12 9l4.5 1.5" '+p+'/><path d="M12 15l-3 6M12 15l3 6" '+p+'/></svg>';
      default: return '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3" '+p+'/><path d="M3.5 14l5-4 5 5 3-3 3.5 3" '+p+'/></svg>';
    }
  }

  /* ================= 状态 ================= */
  var DEFAULT = {
    name:'小梦', face:0, skin:1, wrinkle:0, hair:1, hairColor:1,
    eye:0, eyeColor:0, eyeSize:1, eyeY:0,
    lashN:3, lashY:0, lashSize:1, lashThick:1,
    lidY:0, lidSize:1, lidThick:1,
    lowY:0, lowSize:1, lowThick:1,
    hlShape:0, hlSize:1, hlX:0, hlY:0,
    brow:1, browSize:1, browY:0,
    nose:0, noseSize:1, noseY:0,
    mouth:0, mouthColor:0, mouthSize:1, mouthY:0,
    beard:0, glasses:0, mole:0,
    outfit:0, outfitColor:0, bodyH:0, bodyW:0, bg:0
  };
  var KEY = 'dreamlife.mii.v2';
  var state = {};
  Object.keys(DEFAULT).forEach(function(k){ state[k] = DEFAULT[k]; });

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var o = JSON.parse(raw);
      Object.keys(DEFAULT).forEach(function(k){ if(o[k] !== undefined) state[k] = o[k]; });
    }catch(e){}
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  /* ================= 渲染 ================= */
  var avatar = $('#avatar'), stageEl = $('.stage'), charWrap = $('#charWrap');
  var rail = $('#rail'), grid = $('#grid'), sliders = $('#sliders'), colorsEl = $('#colors'), sgroups = $('#sgroups');
  var optName = $('#optName'), optIdx = $('#optIdx');
  var nameInput = $('#name'), toastEl = $('#toast');
  var activeCat = 'face';

  function catOf(id){
    for(var i=0;i<CATS.length;i++){ if(CATS[i].id === id) return CATS[i]; }
    return CATS[0];
  }

  function renderStage(){
    var b = BGS[state.bg] || BGS[0];
    stageEl.style.background =
      'radial-gradient(140px 140px at 18% 10%, rgba(255,255,255,.55), rgba(255,255,255,0) 72%),'
      + 'radial-gradient(110px 110px at 84% 24%, rgba(255,255,255,.32), rgba(255,255,255,0) 74%),'
      + 'linear-gradient(168deg,' + b.a + ' 0%,' + b.b + ' 100%)';
    avatar.innerHTML = characterSVG(state);
  }

  function thumb(cat, i, t){
    if(cat === 'bg'){
      return '<div class="bgsw" style="background:linear-gradient(165deg,'+BGS[i].a+','+BGS[i].b+')"></div>';
    }
    return '<svg viewBox="'+catOf(cat).vb+'" preserveAspectRatio="xMidYMid meet">'+characterSVG(t)+'</svg>';
  }

  function renderRail(){
    rail.innerHTML = CATS.map(function(c){
      return '<button class="cat'+(c.id===activeCat?' on':'')+'" data-cat="'+c.id+'">'
        + icon(c.id) + '<span>'+c.label+'</span></button>';
    }).join('');
    var on = rail.querySelector('.cat.on');
    if(on && on.scrollIntoView){ on.scrollIntoView({block:'nearest', inline:'center'}); }
  }

  function renderGrid(){
    var cat = catOf(activeCat);
    var list = LISTS[cat.id];
    if(cat.sliderOnly){
      grid.innerHTML = '';
      grid.style.display = 'none';
      return;
    }
    if(cat.colorOnly){
      grid.innerHTML = '';
      grid.style.display = 'none';
      return;
    }
    grid.style.display = 'grid';
    var t = {};
    grid.innerHTML = list.map(function(item, i){
      t = Object.assign({}, state);
      t[cat.key] = i;
      return '<button class="tile'+(state[cat.key]===i?' on':'')+'" data-i="'+i+'">'+thumb(cat.id, i, t)+'</button>';
    }).join('');
  }

  function renderHead(){
    var cat = catOf(activeCat);
    var list = LISTS[cat.id];
    if(cat.sliderOnly){
      optName.innerHTML = '<b>'+cat.label+'</b>'
        + HEIGHT_N[(state.bodyH||0)+3] + ' · ' + BUILD_N[(state.bodyW||0)+3];
      optIdx.textContent = '';
      return;
    }
    if(cat.colorOnly){
      optName.innerHTML = '<b>'+cat.label+'</b>' + (COLOR_NAMES[cat.key] ? COLOR_NAMES[cat.key][state[cat.key]] : '');
      optIdx.textContent = (state[cat.key]+1) + ' / ' + COLORS[cat.key].length;
    } else {
      optName.innerHTML = '<b>'+cat.label+'</b>' + list[state[cat.key]].n;
      optIdx.textContent = (state[cat.key]+1) + ' / ' + list.length;
    }
  }

  function renderSliders(){
    var cat = catOf(activeCat);
    var keys = groupKeys(cat);
    if(!keys){ sliders.innerHTML = ''; sliders.style.display = 'none'; sgroups.style.display = 'none'; return; }
    sliders.style.display = 'block';
    sliders.innerHTML = keys.map(function(key){
      var cfg = SLIDERS[key], v = state[key];
      var val = sliderText(key, v);
      return '<div class="srow"><span class="slabel">'+cfg.label+'</span>'
        + '<input type="range" data-key="'+key+'" min="'+cfg.min+'" max="'+cfg.max+'" step="1" value="'+v+'">'
        + '<span class="sval" data-v="'+key+'">'+val+'</span></div>';
    }).join('');
    if(cat.groups){
      var gi = groupIdx(cat.id);
      sgroups.style.display = 'flex';
      sgroups.innerHTML = cat.groups.map(function(g, i){
        return '<button class="sgrp'+(i===gi?' on':'')+'" data-group="'+i+'">'+g.n+'</button>';
      }).join('');
    } else {
      sgroups.style.display = 'none';
      sgroups.innerHTML = '';
    }
  }

  function renderColors(){
    var cat = catOf(activeCat);
    if(!cat.colorKey){ colorsEl.innerHTML = ''; colorsEl.style.display = 'none'; return; }
    colorsEl.style.display = 'flex';
    var arr = COLORS[cat.colorKey];
    colorsEl.innerHTML = arr.map(function(c, i){
      return '<button class="sw'+(state[cat.colorKey]===i?' on':'')+'" data-color="'+cat.colorKey+'" data-ci="'+i+'" style="--c:'+c+'"></button>';
    }).join('');
  }

  function renderAll(){
    renderStage();
    renderRail();
    renderGrid();
    renderHead();
    renderSliders();
    renderColors();
    if(nameInput.value !== state.name) nameInput.value = state.name;
    persist();
  }

  /* ================= 交互 ================= */
  function buzz(ms){ if(navigator.vibrate){ try{ navigator.vibrate(ms||8); }catch(e){} } }
  function bounce(){
    charWrap.classList.remove('pop');
    void charWrap.offsetWidth;
    charWrap.classList.add('pop');
    setTimeout(function(){ charWrap.classList.remove('pop'); }, 430);
  }
  var toastTimer = null;
  function toast(t){
    toastEl.textContent = t;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('on'); }, 1700);
  }

  rail.addEventListener('click', function(e){
    var btn = e.target.closest('.cat');
    if(!btn) return;
    activeCat = btn.dataset.cat;
    buzz(6);
    renderRail();
    renderGrid();
    renderHead();
    renderSliders();
    renderColors();
  });

  grid.addEventListener('click', function(e){
    var btn = e.target.closest('.tile');
    if(!btn) return;
    var cat = catOf(activeCat);
    state[cat.key] = parseInt(btn.dataset.i, 10);
    var all = grid.querySelectorAll('.tile');
    for(var i=0;i<all.length;i++){ all[i].classList.toggle('on', all[i] === btn); }
    renderHead();
    renderStage();
    persist();
    buzz(8);
    bounce();
  });

  sliders.addEventListener('input', function(e){
    var inp = e.target;
    if(!inp.dataset.key) return;
    var key = inp.dataset.key;
    state[key] = parseInt(inp.value, 10);
    var out = sliders.querySelector('[data-v="'+key+'"]');
    if(out){ out.textContent = sliderText(key, state[key]); }
    if(key === 'bodyH' || key === 'bodyW') renderHead();
    renderStage();
    persist();
  });

  sgroups.addEventListener('click', function(e){
    var b = e.target.closest('.sgrp');
    if(!b) return;
    gIdx[activeCat] = parseInt(b.getAttribute('data-group'), 10) || 0;
    buzz(8);
    renderSliders();
  });

  colorsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.sw');
    if(!btn) return;
    state[btn.dataset.color] = parseInt(btn.dataset.ci, 10);
    var all = colorsEl.querySelectorAll('.sw');
    for(var i=0;i<all.length;i++){ all[i].classList.toggle('on', all[i] === btn); }
    renderStage();
    renderGrid();
    renderHead();
    persist();
    buzz(8);
  });

  nameInput.addEventListener('input', function(){
    state.name = nameInput.value.slice(0,8) || '小梦';
    persist();
  });
  nameInput.addEventListener('blur', function(){
    if(!nameInput.value.trim()){ nameInput.value = '小梦'; state.name = '小梦'; persist(); }
  });

  charWrap.addEventListener('click', function(){ bounce(); buzz(10); });

  /* ---------- 随机 / 重置 ---------- */
  function pick(n){ return Math.floor(Math.random()*n); }
  $('#btnRandom').addEventListener('click', function(){
    state.face = pick(FACE.length);
    state.skin = pick(SKIN.length);
    state.wrinkle = pick(WRINKLE.length);
    state.hair = pick(HAIR.length);
    state.hairColor = pick(HAIR_COLOR.length);
    state.eye = pick(EYES.length);
    state.eyeColor = pick(EYE_COLOR.length);
    state.eyeSize = pick(3); state.eyeY = pick(7)-3;
    state.lashN = pick(4); state.lashY = pick(7)-3; state.lashSize = pick(3); state.lashThick = pick(3);
    state.lidY = pick(7)-3; state.lidSize = pick(3); state.lidThick = pick(3);
    state.lowY = pick(7)-3; state.lowSize = pick(3); state.lowThick = pick(3);
    state.hlShape = pick(4); state.hlSize = pick(3); state.hlX = pick(7)-3; state.hlY = pick(7)-3;
    state.brow = pick(BROW.length);
    state.browSize = pick(3); state.browY = pick(7)-3;
    state.nose = pick(NOSE.length);
    state.noseSize = pick(3); state.noseY = pick(7)-3;
    state.mouth = pick(MOUTH.length);
    state.mouthColor = pick(MOUTH_COLOR.length);
    state.mouthSize = pick(3); state.mouthY = pick(7)-3;
    state.beard = pick(BEARD.length);
    state.glasses = pick(GLASSES.length);
    state.mole = pick(2);
    state.outfit = pick(OUTFIT.length);
    state.bodyH = pick(7) - 3; state.bodyW = pick(7) - 3;
    state.outfitColor = pick(OUTFIT_COLOR.length);
    state.bg = pick(BGS.length);
    buzz(14);
    renderAll();
    bounce();

  var rgbCache = {};
  function hexRGB(h){
    if(rgbCache[h]) return rgbCache[h];
    var n = parseInt(h.slice(1), 16);
    var v = [n >> 16, (n >> 8) & 255, n & 255];
    rgbCache[h] = v;
    return v;
  }
  function nearestIdx(pal, r, g, b){
    var best = 0, bd = Infinity;
    for(var i = 0; i < pal.length; i++){
      var p = hexRGB(pal[i]);
      var dr = (r - p[0]) * 0.85, dg = (g - p[1]) * 1.15, db = (b - p[2]) * 0.85;
      var d = dr * dr + dg * dg + db * db;
      if(d < bd){ bd = d; best = i; }
    }
    return best;

  // 肤色判定：暖色序 + YCbCr，并用亮度下限排除深色头发
  function isSkinPx(r, g, b){
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if(mx - mn < 15) return false;
    if(!(r > g && g > b)) return false;
    if(r - g < 15) return false;
    if(r < 95 || g < 40 || b < 20) return false;
    var cb = 128 - 0.168736 * r - 0.331264 * g + 0.5 * b;
    var cr = 128 + 0.5 * r - 0.418688 * g - 0.081312 * b;
    return cb > 72 && cb < 132 && cr > 130 && cr < 180;
  }

  function analyzePhoto(img){

    var w = Math.max(1, Math.round(img.width * sc));
    var h = Math.max(1, Math.round(img.height * sc));
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;

    function med(a){

      }
    }
    var hnum = 0, hairRGB = null;
    if(hCand.length >= 60){
      // 头发比背景/皮肤暗，但比纯阴影亮：取亮度中间的 35%~80% 求中位色
      var lums = [], hi;
      for(hi = 0; hi < hCand.length; hi++) lums.push(hCand[hi][0] * 0.299 + hCand[hi][1] * 0.587 + hCand[hi][2] * 0.114);
      var lLo = pct(lums, 0.35), lHi = pct(lums, 0.80), cr = [], cg = [], cb = [];
      for(hi = 0; hi < hCand.length; hi++){
        var lv = hCand[hi][0] * 0.299 + hCand[hi][1] * 0.587 + hCand[hi][2] * 0.114;
        if(lv >= lLo && lv <= lHi){ cr.push(hCand[hi][0]); cg.push(hCand[hi][1]); cb.push(hCand[hi][2]); }
      }
      if(cr.length >= 20){
        hairRGB = [med(cr), med(cg), med(cb)];
        hnum = cr.length;
      }
    }
    function isHairPx(xx, yy){
      if(!hairRGB) return false;
      if(xx < 0 || yy < 0 || xx >= w || yy >= h) return false;
      var q = RGB(xx, yy);
      if(isSkinPx(q[0], q[1], q[2])) return false;
      if(bgc && dist2(q, bgc) < 1450) return false;
      return dist2(q, hairRGB) < 5200;
    }

    /* 4) 发型：侧边发丝定长度，额前覆盖率定刘海 / 侧分 */
    var sTot = 0, sHit = 0, sideLow = 0;
    for(y = Math.round(ey); y <= Math.round(chinY + fh * 0.35); y++){
      for(i = 0; i < 2; i++){
        x = i ? Math.round(x1 + fw * 0.10) : Math.round(x0 - fw * 0.10);
        sTot++;
        if(isHairPx(x, y)){ sHit++; if(y > sideLow) sideLow = y; }
      }
    }
    var bL = 0, bLn = 0, bR = 0, bRn = 0;
    for(y = Math.round(ey - fh * 0.34); y <= Math.round(ey - fh * 0.10); y++){
      for(x = Math.round(cx - fw * 0.40); x < Math.round(cx); x++){ bLn++; if(isHairPx(x, y)) bL++; }
      for(x = Math.round(cx); x <= Math.round(cx + fw * 0.40); x++){ bRn++; if(isHairPx(x, y)) bR++; }
    }
    var bangs = (bLn + bRn) ? (bL + bR) / (bLn + bRn) : 0;
    var bAsym = Math.abs((bLn ? bL / bLn : 0) - (bRn ? bR / bRn : 0));

    var hairIdx = null, hairColorIdx = null;
    if(hairRGB){
      var hl = hairRGB[0] * 0.299 + hairRGB[1] * 0.587 + hairRGB[2] * 0.114;
      var hsat = Math.max(hairRGB[0], hairRGB[1], hairRGB[2]) - Math.min(hairRGB[0], hairRGB[1], hairRGB[2]);
      var longHair = sideLow > chinY + fh * 0.30 && sHit / (sTot || 1) > 0.30;
      hairColorIdx = nearestIdx(HAIR_COLOR, hairRGB[0], hairRGB[1], hairRGB[2]);
      if(hl > 228 && hsat < 24 && sHit / (sTot || 1) < 0.20) hairIdx = 11;   // 光头
      else if(longHair) hairIdx = 5;                                          // 长直发
      else if(bangs > 0.26 && bAsym > 0.18) hairIdx = 8;                      // 侧分
      else if(bangs > 0.45) hairIdx = 1;                                      // 齐刘海
      else hairIdx = 0;                                                       // 短碎发
    }

    /* 5) 脸型：脸宽/脸高比 + 下颌收窄程度（向平均值收缩，避免遮挡导致极端） */
    var ratio = fw / fh;
    if(!(ratio > 0.64 && ratio < 1.14)) ratio = 0.86;
    ratio = ratio + (0.86 - ratio) * 0.30;
    var jawW = 0, jawN = 0;
    for(y = Math.round(chinY - fh * 0.16); y < chinY; y++){
      if(runW[y] > 0){ jawW += runW[y]; jawN++; }
    }
    var narrow = jawN ? (jawW / jawN) / fw : 0.95;
    var sq = narrow > 0.90;
    var faceIdx;
    if(ratio > 1.02) faceIdx = 4;
    else if(ratio > 0.90) faceIdx = sq ? 2 : 0;
    else if(ratio > 0.855) faceIdx = 6;
    else if(ratio > 0.815) faceIdx = sq ? 7 : 6;
    else if(ratio > 0.745) faceIdx = sq ? 1 : 3;
    else faceIdx = 5;

    /* 5) 瞳色：眼部深色像素 */
    var er = [], eg = [], eb = [];
    for(y = Math.round(ey - fh * 0.02); y <= Math.round(ey + fh * 0.07); y++){
      for(x = Math.round(cx - fw * 0.36); x <= Math.round(cx + fw * 0.36); x++){
        c = RGB(x, y);
        if(Math.max(c[0], c[1], c[2]) > 115) continue;
        if(isSkinPx(c[0], c[1], c[2])) continue;
        er.push(c[0]); eg.push(c[1]); eb.push(c[2]);
      }
    }
    var eyeColorIdx = er.length >= 8 ? nearestIdx(EYE_COLOR, med(er), med(eg), med(eb)) : null;

    /* 5b) 眼睛大小 / 眉毛粗细 / 嘴巴大小 / 胡子：局部深色像素占比 */
    function darkRatio(xa, xb, ya, yb, maxv){
      var n = 0, tot = 0, qx, qy, q;
      for(qy = Math.round(ya); qy <= Math.round(yb); qy++){
        for(qx = Math.round(xa); qx <= Math.round(xb); qx++){
          q = RGB(qx, qy); tot++;
          if(q[0] > maxv || q[1] > maxv || q[2] > maxv) continue;
          if(isSkinPx(q[0], q[1], q[2])) continue;
          n++;
        }
      }
      return tot ? n / tot : 0;
    }
    var dEye = darkRatio(cx - fw * 0.34, cx + fw * 0.34, ey - fh * 0.03, ey + fh * 0.09, 118);
    var eyeSizeIdx = dEye > 0.24 ? 2 : (dEye > 0.13 ? 1 : 0);
    var dBrow = darkRatio(cx - fw * 0.32, cx + fw * 0.32, ey - fh * 0.20, ey - fh * 0.05, 105);
    var browSizeIdx = dBrow > 0.28 ? 2 : (dBrow > 0.15 ? 1 : 0);

    var mCnt = 0, mTot = 0, mMinX = w, mMaxX = -1, mr = [], mg = [], mb = [];
    for(y = Math.round(chinY - fh * 0.32); y <= Math.round(chinY - fh * 0.12); y++){
      for(x = Math.round(cx - fw * 0.34); x <= Math.round(cx + fw * 0.34); x++){
        c = RGB(x, y); mTot++;
        if(c[0] - c[1] > 26 && c[0] > 70 && Math.max(c[0], c[1], c[2]) < 235){
          mCnt++; mr.push(c[0]); mg.push(c[1]); mb.push(c[2]);
          if(x < mMinX) mMinX = x;
          if(x > mMaxX) mMaxX = x;
        }
      }
    }
    var mouthSizeIdx = null, mouthRGB = null;
    if(mTot > 0 && mCnt / mTot > 0.03){
      var mwRatio = (mMaxX - mMinX) / fw;
      mouthSizeIdx = mwRatio > 0.40 ? 2 : (mwRatio > 0.26 ? 1 : 0);
      mouthRGB = [med(mr), med(mg), med(mb)];
    }

    var dJaw = darkRatio(cx - fw * 0.40, cx + fw * 0.40, chinY - fh * 0.20, chinY, 120);
    var beardIdx = dJaw > 0.46 ? 4 : (dJaw > 0.34 ? 2 : 0);

    /* 6) 服装主色：画面下部靠中轴、明亮（受光）区域的中位色 */
    var oR = [], oG = [], oB = [], oTot = 0;
    for(y = Math.round(h * 0.74); y < h; y++){
      for(x = Math.round(cx - w * 0.42); x <= Math.round(cx + w * 0.42); x++){
        if(x < 0 || x >= w) continue;
        c = RGB(x, y);
        oTot++;
        if(isSkinPx(c[0], c[1], c[2])) continue;
        if(c[0] * 0.299 + c[1] * 0.587 + c[2] * 0.114 < 165) continue;   // 阴影 / 椅子 / 深色
        oR.push(c[0]); oG.push(c[1]); oB.push(c[2]);
      }
    }
    var outfitColorIdx = null, oRGB = null;
    if(oR.length >= 60 && oR.length / oTot > 0.06){
      oRGB = [med(oR), med(oG), med(oB)];
      var oMX = Math.max(oRGB[0], oRGB[1], oRGB[2]), oMN = Math.min(oRGB[0], oRGB[1], oRGB[2]);
      var oLum = oRGB[0] * 0.299 + oRGB[1] * 0.587 + oRGB[2] * 0.114;
      if(oMX - oMN < 24) outfitColorIdx = oLum > 150 ? 7 : 8;   // 白 / 深灰
      else outfitColorIdx = nearestIdx(OUTFIT_COLOR, oRGB[0], oRGB[1], oRGB[2]);
    }

    /* 7) 生成新小人参数 */
    var patch = {};
    Object.keys(DEFAULT).forEach(function(k){ patch[k] = DEFAULT[k]; });
    patch.name = state.name;
    patch.bg = state.bg;
    patch.face = faceIdx;
    patch.skin = nearestIdx(SKIN, skinRGB[0], skinRGB[1], skinRGB[2]);
    if(hairIdx !== null) patch.hair = hairIdx;
    if(hairColorIdx !== null) patch.hairColor = hairColorIdx;
    if(eyeColorIdx !== null) patch.eyeColor = eyeColorIdx;
    if(outfitColorIdx !== null) patch.outfitColor = outfitColorIdx;
    patch.eyeSize = eyeSizeIdx;
    patch.browSize = browSizeIdx;
    if(mouthSizeIdx !== null){
      patch.mouthSize = mouthSizeIdx;
      patch.mouthColor = nearestIdx(MOUTH_COLOR, mouthRGB[0], mouthRGB[1], mouthRGB[2]);
    }
    patch.beard = beardIdx;

    return {
      patch: patch,
      label: SKIN_NAME[patch.skin] + '肤色 · ' + HAIR[patch.hair].n + ' · ' + FACE[patch.face].n
    };
  }

  var fileIn = $('#fileIn');
  var photoSheet = $('#photoSheet');

  function closePhotoSheet(){ photoSheet.classList.remove('on'); }

  function applyPhotoSrc(src){
    toast('正在识别照片…');
    var img = new Image();
    img.onload = function(){
      var res = null;
      try{ res = analyzePhoto(img); }catch(e){}
      if(!res){ toast('没识别到人脸，换一张清晰正脸照试试'); return; }
      Object.keys(res.patch).forEach(function(k){ state[k] = res.patch[k]; });
      renderAll();
      bounce();
      buzz(14);
      toast('已按照片生成：' + res.label);
    };
    img.onerror = function(){ toast('图片读取失败，换一张试试'); };
    img.src = src;
  }

  $('#sampleImg').src = SAMPLE_PHOTO;

  $('#btnPhoto').addEventListener('click', function(){
    buzz(8);
    photoSheet.classList.add('on');
  });
  $('#photoClose').addEventListener('click', function(){
    closePhotoSheet();
  });
  photoSheet.addEventListener('click', function(e){
    if(e.target === photoSheet) closePhotoSheet();
  });

  $('#btnSample').addEventListener('click', function(){
    closePhotoSheet();
    buzz(8);
    applyPhotoSrc(SAMPLE_PHOTO);
  });
  $('#btnPickFile').addEventListener('click', function(){
    closePhotoSheet();
    buzz(8);
    fileIn.value = '';
    fileIn.click();
  });

  fileIn.addEventListener('change', function(){
    var f = fileIn.files && fileIn.files[0];
    if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){ applyPhotoSrc(fr.result); };
    fr.onerror = function(){ toast('图片读取失败，换一张试试'); };
    fr.readAsDataURL(f);
  });

  /* ---------- 导出 / 分享 ---------- */
  function isIOS(){
    return /iP(hone|ad|od)/.test(navigator.userAgent)
      || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }

  function buildSVG(){
    var b = BGS[state.bg] || BGS[0];
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="800" height="1040">'
      + '<defs><linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="'+b.a+'"/><stop offset="1" stop-color="'+b.b+'"/>'
      + '</linearGradient></defs>'
      + bgSVG(state.bg) + characterSVG(state) + '</svg>';
  }

  function makeCanvas(){
    return new Promise(function(resolve, reject){
      // 用 data: URL 而不是 blob:，避免 Safari / 微信 WebView 把 canvas 标记为污染导致导出失败
      var src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildSVG());
      var img = new Image();
      img.onload = function(){
        var W = 800, H = 1040, PAD = 96;
        var canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H + PAD;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = (BGS[state.bg]||BGS[0]).b;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, W, H);
        ctx.fillStyle = '#333333';
        ctx.font = '600 42px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.name || '小梦', W/2, H + PAD/2 - 4);
        resolve(canvas);
      };
      img.onerror = function(e){ reject(e); };
      img.src = src;
    });
  }

  $('#btnSave').addEventListener('click', function(){
    buzz(10);
    toast('正在生成图片…');
    makeCanvas().then(function(canvas){
      // iOS 上 blob 下载常常被拦，改成「长按存图」
      if(isIOS()){
        $('#saveImg').src = canvas.toDataURL('image/png');
        $('#saveSheet').classList.add('on');
        toast('长按图片可存到相册');
        return;
      }
      canvas.toBlob(function(blob){
        if(!blob){ toast('导出失败'); return; }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (state.name || '小梦') + '-梦想生活.png';
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        toast('图片已保存');
      }, 'image/png');
    }).catch(function(){ toast('导出失败，请换浏览器试试'); });
  });

  $('#sheetClose').addEventListener('click', function(){
    $('#saveSheet').classList.remove('on');
  });
  $('#saveSheet').addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('on');
  });

  /* 适配 iOS 浏览器地址栏高度变化 */
  function fitHeight(){
    document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
  }
  fitHeight();
  window.addEventListener('resize', fitHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(fitHeight, 260); });

  $('#btnShare').addEventListener('click', function(){
    buzz(10);
    var desc = '我在「梦想生活」制作的小人：' + (state.name || '小梦')
      + '｜' + FACE[state.face].n + ' · ' + HAIR[state.hair].n + ' · ' + EYES[state.eye].n + ' · ' + MOUTH[state.mouth].n;
    makeCanvas().then(function(canvas){
      canvas.toBlob(function(blob){
        if(!blob){ toast('分享失败'); return; }
        var file = new File([blob], (state.name||'小梦')+'-梦想生活.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({files:[file], text:desc}).catch(function(){});
        } else if(navigator.share){
          navigator.share({title:'梦想生活 · 制作小人', text:desc}).catch(function(){});
        } else if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(desc).then(function(){ toast('文案已复制'); }).catch(function(){ toast(desc); });
        } else {
          toast(desc);
        }
      });
    }).catch(function(){ toast('分享失败，请用「保存」导出图片'); });
  });

  /* ---------- 启动 ---------- */
  load();
  renderAll();
})();
</script>
</body>
</html>
